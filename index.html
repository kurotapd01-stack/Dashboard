<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผงติดตามการผลิต OEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.045);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#898781; --plan:#b9b8b0;
  --good:#006300; --crit:#c23030; --yel:#d99a00; --pos:#2a78d6; --neg:#e34948;
  --rail:#0d366b; --rail-ink:#e8eefb; --rail-dim:#9fb4d8; --rail-hi:#1c5cab;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --plan:#5d5c57;
    --good:#0ca30c; --crit:#e66767; --yel:#f0b429; --pos:#3987e5; --neg:#e66767;
    --rail:#11161c; --rail-hi:#1f2a38;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --plan:#5d5c57;
  --good:#0ca30c; --crit:#e66767; --yel:#f0b429; --pos:#3987e5; --neg:#e66767;
  --rail:#11161c; --rail-hi:#1f2a38;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 14px/1.5 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:17px;line-height:1.25;padding:2px 8px 14px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--rail-dim);margin-top:2px}
.rail h2{font-size:12px;font-weight:500;color:var(--rail-dim);margin:14px 8px 4px}
.rail button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--rail-ink);cursor:pointer;display:flex;flex-direction:column;gap:0;width:100%}
.rail button:hover{background:rgba(255,255,255,.08)}
.rail button[aria-current="true"]{background:var(--rail-hi)}
.rail button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,th button:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
.rail .code{font-weight:600}
.rail .full{font-size:12px;color:var(--rail-dim)}
.rail .nav button{flex-direction:row;align-items:center;gap:8px}
.rail .spacer{flex:1}
.rail .foot{font-size:12px;color:var(--rail-dim);padding:8px}
.main{padding:18px 24px 48px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.fld input,.fld select{background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 8px;color:var(--ink);min-width:130px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.page-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.page-title h1{font-size:20px;margin:0;font-weight:700}
.page-title span{color:var(--ink2);font-size:13px}
.grid{display:grid;gap:14px}
.g1{grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin:0}
.card .sub{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.chartbox{position:relative}
.chartbox canvas{max-width:100%}
.kpi{padding:12px 14px}
.kpi .lbl{font-size:12px;color:var(--ink2)}
.kpi .val{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.kpi .gap{font-size:12px;margin-top:4px;color:var(--ink2)}
.kpi .val.st-red{color:var(--crit)} .kpi .val.st-green{color:var(--good)} .kpi .val.st-yellow{color:var(--yel)}
.kpi .gap.st-red{color:var(--crit);font-weight:600} .kpi .gap.st-green{color:var(--good);font-weight:600} .kpi .gap.st-yellow{color:var(--yel);font-weight:600}
.up{color:var(--good);font-weight:600}
.down{color:var(--crit);font-weight:600}
.kpis{margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--surface)}
th button{background:none;border:0;cursor:pointer;font-weight:600;color:var(--ink2);padding:0;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:560px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);border:1px solid var(--axis);border-radius:999px;padding:2px 10px;background:var(--plane);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink2);color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.warn{background:var(--wash);border-left:3px solid var(--s4);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.empty{padding:40px 24px;text-align:center}
.empty h2{margin:0 0 6px;font-size:18px}
.tbl{display:none;margin-top:8px}
.card.showtbl .tbl{display:block}
.card.showtbl .chartbox{display:none}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}
.form-row input[type=text],.form-row input[type=url]{flex:1;min-width:260px;background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 8px;color:var(--ink)}
.status{font-size:12px;color:var(--ink2)}
.status.ok{color:var(--good)} .status.bad{color:var(--crit)}
code{background:var(--wash);padding:1px 5px;border-radius:4px;font-size:12px}

/* Executive dashboard refresh */
.main{padding:24px clamp(16px,2.4vw,38px) 52px;max-width:1900px;margin:0 auto;width:100%}
.app{grid-template-columns:248px minmax(0,1fr)}
.rail{padding:24px 16px;gap:8px;box-shadow:8px 0 28px rgba(10,25,48,.06)}
.brand{font-size:18px;padding:4px 10px 18px;letter-spacing:-.2px}
.rail h2{margin:18px 10px 6px;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.rail button{padding:10px 12px;border-radius:10px;transition:background .18s ease,transform .18s ease}
.rail button:hover{transform:translateX(2px)}
.rail .nav button{font-weight:500}
.page-title{margin:2px 0 18px;align-items:center}
.page-title h1{font-size:26px;letter-spacing:-.6px}
.page-title span{font-size:12px}
.filters{border-radius:14px;padding:14px 16px;box-shadow:0 4px 18px rgba(20,35,55,.035);margin-bottom:18px}
.card{border-radius:16px;padding:17px 18px;box-shadow:0 4px 18px rgba(20,35,55,.035);transition:box-shadow .18s ease,border-color .18s ease}
.card:hover{box-shadow:0 8px 26px rgba(20,35,55,.07);border-color:rgba(42,120,214,.22)}
.card h3{font-size:14px;letter-spacing:-.1px}
.card .sub{line-height:1.55;min-height:18px}
.kpi{padding:17px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--s1);opacity:.72}
.kpi .lbl{font-size:12px;font-weight:500}
.kpi .val{font-size:clamp(25px,2vw,34px);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kpi .gap{font-size:11px;line-height:1.5}
.exec-kpis{margin-bottom:10px}
.exec-kpis .kpi:first-child{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--s1) 7%,var(--surface)));border-color:color-mix(in srgb,var(--s1) 28%,var(--border))}
.exec-kpis .kpi:first-child:before{width:4px}
.component-kpis .kpi:first-child{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--s1) 7%,var(--surface)));border-color:color-mix(in srgb,var(--s1) 28%,var(--border))}
.component-kpis .kpi:first-child:before{width:4px}
.component-kpis{margin-bottom:25px}
.component-kpis .kpi{padding:12px 16px}
.component-kpis .kpi .val{font-size:24px}
#xfbar .xf{border-radius:12px;box-shadow:0 4px 14px rgba(20,35,55,.04)}
.btn{transition:background .15s ease,border-color .15s ease}
@media(max-width:900px){.main{padding:16px 16px 40px}.app{grid-template-columns:1fr}.rail{box-shadow:none}.page-title h1{font-size:22px}}
@media(max-width:520px){.card{padding:14px}}
@media(prefers-reduced-motion:reduce){.card,.rail button,.btn{transition:none}}

/* cross-filter */
#xfbar .xf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:8px 12px;background:var(--surface);border:1px solid var(--s1);border-radius:12px;position:sticky;top:8px;z-index:20}
#xfbar .xf-l{font-size:12px;color:var(--ink2);font-weight:600}
#xfbar .chip b{font-weight:600;color:var(--ink)}
#xfbar .hint{margin:-6px 0 12px}
/* live status */
.rail .live{font-size:12px;color:var(--rail-dim);padding:6px 8px;display:flex;align-items:flex-start;gap:8px;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:#898781}
.dot.ok{background:#3ddc97;animation:pulse 2s infinite}
.dot.sync{background:#f2b632}
.dot.bad{background:#ff7a7a}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
@media (prefers-reduced-motion:reduce){.dot.ok{animation:none}}
details summary{cursor:pointer}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;height:100%;width:272px;max-width:84vw;z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:none}
  body.drawer-open .rail{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.35)}
  .rail-tgl{display:none!important}
  body .drawer-fab{display:flex}
  body.drawer-open .scrim{opacity:1;pointer-events:auto}
  .main{padding:60px 16px 40px}
  .g2{grid-template-columns:1fr}
  .fld input,.fld select{min-width:110px}
}
@media (max-width:520px){.g4,.g5{grid-template-columns:1fr}}

/* ===== Motion layer: odometer scoreboard + entrance animations ===== */
.od{display:inline-flex;align-items:flex-start;font-variant-numeric:tabular-nums}
.od-d{display:inline-block;height:1.15em;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.od-r{display:block;will-change:transform;transition:transform var(--od-dur,1.4s) cubic-bezier(.12,.8,.2,1) var(--od-delay,0s)}
.od-r i{display:block;font-style:normal;height:1.15em;line-height:1.15em;text-align:center}
@keyframes odflash{0%{text-shadow:0 0 0 transparent}25%{text-shadow:0 0 16px currentColor}100%{text-shadow:0 0 0 transparent}}
.kpi .val.od-flash{animation:odflash 1.1s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.view-enter .card{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.view-enter .kpi:before{transform-origin:top;animation:barGrow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms + .15s)}
.view-enter .kpi .gap{animation:rise .5s ease both;animation-delay:calc(var(--i,0)*55ms + .45s)}
.kpi{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.view-enter .card,.view-enter .kpi:before,.view-enter .kpi .gap,.kpi .val.od-flash{animation:none}.od-r{transition:none}.kpi{transition:none}.kpi:hover{transform:none}}

/* ===== Drawer (side bar ย่อ/ขยายได้) ===== */
.app{transition:grid-template-columns .25s ease}
.rail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.rail-top .brand{flex:1;min-width:0}
.rail .rail-tgl{width:34px;height:34px;flex:none;padding:0;align-items:center;justify-content:center;font-size:18px;line-height:1;border:1px solid rgba(255,255,255,.18);border-radius:9px;display:flex}
.rail .nav button .ic,.rail #refreshBtn .ic,.rail #themeBtn .ic{width:20px;text-align:center;flex:none}
.rail #refreshBtn,.rail #themeBtn{flex-direction:row;align-items:center;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(8,16,30,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s ease}
.drawer-fab{display:none;position:fixed;top:10px;left:10px;z-index:50;width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.drawer-fab:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
@media (min-width:901px){
  body.rail-mini .app{grid-template-columns:68px minmax(0,1fr)}
  body.rail-mini .rail{padding:20px 10px;align-items:center;overflow-x:hidden}
  body.rail-mini .rail-top{flex-direction:column;align-items:center}
  body.rail-mini .rail .brand .bt,body.rail-mini .rail h2,body.rail-mini .rail .full,body.rail-mini .rail .nl,body.rail-mini .rail .tx,body.rail-mini .rail .live span:last-child{display:none}
  body.rail-mini .rail button{align-items:center;justify-content:center;padding:10px 6px}
  body.rail-mini .rail #refreshBtn,body.rail-mini .rail #themeBtn,body.rail-mini .rail .nav button{gap:0}
  body.rail-mini .rail .live{justify-content:center;padding:6px 0}
  body.rail-mini .rail button:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){.app,.rail,.scrim{transition:none}}

/* ===== Product bar (เลือกผลิตภัณฑ์ด้านบนสุด · ย่อ/ขยายได้) ===== */
.prodbar{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px rgba(20,35,55,.035);margin-bottom:16px;padding:10px 12px}
.pb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pb-label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.pb-cur{display:none;font-size:13px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-cur b{color:var(--ink);font-weight:700}
.lang-sw{margin-left:auto;display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden;flex:none}
.lang-sw button{background:var(--plane);border:0;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--ink2)}
.lang-sw button+button{border-left:1px solid var(--axis)}
.lang-sw button:hover:not([aria-pressed="true"]){background:var(--wash)}
.lang-sw button[aria-pressed="true"]{background:var(--rail-hi);color:#fff;font-weight:600}
.lang-sw button:focus-visible{outline:2px solid var(--s4);outline-offset:-2px}
.pb-tgl{display:inline-flex;align-items:center;gap:6px;background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--ink);flex:none}
.pb-tgl:hover{background:var(--wash)}
.pb-list{order:5;flex:1 0 100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pb{background:var(--plane);border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:0;min-width:0;transition:background .15s ease,border-color .15s ease}
.pb:hover{background:var(--wash);border-color:var(--axis)}
.pb .code{font-weight:700;font-size:15px}
.pb .full{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb[aria-current="true"]{background:var(--rail-hi);border-color:var(--rail-hi);color:#fff}
.pb[aria-current="true"] .full{color:rgba(255,255,255,.82)}
.pb:focus-visible,.pb-tgl:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
/* โหมดย่อ: เหลือแถบเล็กบรรทัดเดียว */
.prodbar.collapsed{padding:6px 10px}
.prodbar.collapsed .pb-head{flex-wrap:nowrap}
.prodbar.collapsed .pb-cur{display:block;flex:1 1 auto}
.prodbar.collapsed .pb-list{order:2;flex:0 0 auto;display:flex;gap:6px}
.prodbar.collapsed .lang-sw{order:3;margin-left:0}
.prodbar.collapsed .pb-tgl{order:4}
.prodbar.collapsed .pb{padding:4px 12px;border-radius:999px;flex-direction:row}
.prodbar.collapsed .pb .code{font-size:13px}
.prodbar.collapsed .pb .full{display:none}
@media(max-width:900px){
  .pb-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prodbar.collapsed .pb-head{flex-wrap:wrap}
  .prodbar.collapsed .pb-cur{flex:1 0 100%;order:5}
}
.rail .brand{display:flex;align-items:center;gap:10px}
.rail .brand .logo{width:34px;height:34px;flex:none}
body.rail-mini .rail .brand{padding:4px 0 10px;justify-content:center}
:root:lang(ja) body{font-family:"IBM Plex Sans Thai","Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif}
@media(prefers-reduced-motion:reduce){.pb{transition:none}}

function trl(s){
  if (LANG==='th' || typeof s!=='string' || !THRE.test(s)) return s;
  const k = LANG==='en' ? 0 : 1;
  const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const e = I18N_EXACT[m[2]];
  if (e) return m[1]+e[k]+m[3];
  let out = s;
  for (const [re,en,ja] of I18N_PATS) out = out.replace(re, k===0 ? en : ja);
  return out;
}
/* แปลข้อความที่ถูกวาดลงหน้าเว็บ (ข้อความ + title / aria-label / placeholder) แล้วคอยตามดูการเปลี่ยนแปลง */
const I18N_ATTRS = ['title','aria-label','placeholder'];
const trSkip = el => !!(el && el.closest && el.closest('.lang-sw,[translate="no"],script,style,textarea'));
function trText(n){
  if (LANG==='th') return; const v=n.nodeValue; if (!v || !THRE.test(v) || trSkip(n.parentElement)) return;
  const t=trl(v); if (t!==v) n.nodeValue=t;
}
function trAttrs(el){
  if (LANG==='th' || !el.getAttribute) return;
  for (const a of I18N_ATTRS){ const v=el.getAttribute(a); if (v && THRE.test(v)){ const t=trl(v); if (t!==v) el.setAttribute(a,t); } }
}
function trTree(root){
  if (LANG==='th' || !root) return;
  if (root.nodeType===3){ trText(root); return; }
  if (root.nodeType!==1 || trSkip(root)) return;
  trAttrs(root);
  root.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>{ if (!trSkip(el)) trAttrs(el); });
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while ((n=w.nextNode())) trText(n);
}
let _trBusy=false;
const _trMO = new MutationObserver(ms=>{
  if (LANG==='th' || _trBusy) return; _trBusy=true;
  try{ for (const m of ms){
    if (m.type==='childList') m.addedNodes.forEach(trTree);
    else if (m.type==='characterData') trText(m.target);
    else if (m.type==='attributes') trAttrs(m.target);
  } } finally { _trMO.takeRecords(); _trBusy=false; }
});

function num(v){
  if (v==null || v==='') return 0;
  if (typeof v==='number') return isFinite(v)? v : 0;
  let s=String(v).trim().replace(/,/g,'');
  if (s.endsWith('%')) { const n=parseFloat(s); return isFinite(n)? n/100 : 0; }
  const n=parseFloat(s); return isFinite(n)? n : 0;
}
const pad = n => String(n).padStart(2,'0');
function parseDate(v){
  if (v==null || v==='') return null;
  if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if (typeof v==='number'){ if (v<20000||v>80000) return null; const d=new Date(Math.round((Math.floor(v)-25569)*86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s=String(v).trim(); let m;
  if ((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{4})/))) { const mo=EN_M[m[2].toLowerCase()]; if (mo) return `${m[3]}-${pad(mo)}-${pad(m[1])}`; }
  if ((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) { let a=+m[1], b=+m[2]; if (b>12){ [a,b]=[b,a]; } return `${m[3]}-${pad(b)}-${pad(a)}`; }
  return null;
}
const normPart = p => { let s=String(p??'').trim(); if (/^\d+\.0$/.test(s)) s=s.slice(0,-2); return s.replace(/\(.*?\)/g,'').replace(/\s+/g,'').toUpperCase(); };
const normLabel = h => String(h??'').replace(/\s+/g,' ').trim();
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cur); cur=''; }
    else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if (c==='\r'){}
    else cur+=c;
  }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function buildCombined(aoa){
  if (!aoa || aoa.length<2) throw new Error('ชีต Combined ว่างเปล่า');
  const H = aoa[0].map(h => String(h??'').trim());
  const ix = n => H.indexOf(n);
  const need = {id:'RecordID',date:'Date',shift:'Shift',proc:'Process',part:'PartNumber',planned:'Planned Time (min)',run:'Run Time (min)',down:'Downtime (min)',ct:'Ideal Cycle Time (sec)',total:'Total Pcs',good:'Good Pcs',ng:'NG Pcs'};
  const c = {}; const missing=[];
  for (const [k,n] of Object.entries(need)){ c[k]=ix(n); if (c[k]<0) missing.push(n); }
  if (missing.length) throw new Error('ไม่พบคอลัมน์: '+missing.join(', ')+' (ต้องเป็นชีต Combined)');
  c.dn = ix('DayNight');
  const lossCols=[], ngCols=[];
  H.forEach((h,i)=>{
    if (h.startsWith('Loss: ')){ const [cat,...r]=h.slice(6).split(' | '); lossCols.push({i,cat:catShort(cat.trim()),reason:r.join(' | ').trim()}); }
    else if (h.startsWith('NG: ')) ngCols.push({i,label:h.slice(4).trim()});
  });
  const out=[]; let skipped=0, skippedPcs=0;
  for (let r=1;r<aoa.length;r++){
    const row=aoa[r]; if (!row || row[c.id]==null || row[c.id]==='') continue;
    const date=parseDate(row[c.date]);
    if (!date){ const pcs=num(row[c.total]); if (pcs>0){ skipped++; skippedPcs+=pcs; } continue; }
    const rec={ date, shift:String(row[c.shift]??'').trim(), dn:c.dn>=0?String(row[c.dn]??'').trim():'', proc:String(row[c.proc]??'').trim(), part:String(row[c.part]??'').trim(),
      planned:num(row[c.planned]), run:num(row[c.run]), down:num(row[c.down]), ct:num(row[c.ct]), total:num(row[c.total]), good:num(row[c.good]), ng:num(row[c.ng]),
      loss:{}, reasons:{}, ngt:{} };
    for (const L of lossCols){ const v=num(row[L.i]); if (v){ rec.loss[L.cat]=(rec.loss[L.cat]||0)+v; const k=L.cat+'|'+L.reason; rec.reasons[k]=(rec.reasons[k]||0)+v; } }
    for (const N of ngCols){ const v=num(row[N.i]); if (v) rec.ngt[N.label]=(rec.ngt[N.label]||0)+v; }
    out.push(rec);
  }
  out.skipped={n:skipped,pcs:skippedPcs};
  return out;
}
function buildPlan(aoa, product){
  const map = CONFIG.planMap[product] || {};
  const H = aoa[0].map(normLabel); const out=[]; const unmapped=new Set();
  for (let r=1;r<aoa.length;r++){
    const row=aoa[r]; const date=parseDate(row[0]); if (!date) continue;
    for (let j=1;j<H.length;j++){
      const h=H[j]; if (!h || h==='Total') continue;
      const q=num(row[j]); if (!q) continue;
      const m=h.match(/^(.*?)\s+(\S+)$/); const label=m?m[1]:h; let part=m?m[2]:'';
      const sfx=label.match(/"([SL])"$/);
      const procs=map[label];
      if (!procs) unmapped.add(h);
      out.push({date, label, procs: procs||[], group: procs? procs[0] : '(ยังไม่จับคู่) '+label, part: normPart(part)+(sfx?sfx[1]:''), qty:q});
    }
  }
  return {rows:out, unmapped:[...unmapped]};
}
const groupOf = (product, proc) => {
  const map=CONFIG.planMap[product]||{};
  for (const ps of Object.values(map)) if (ps.includes(proc)) return ps[0];
  return proc;
};
/* กระบวนการ Screen (Screening 1 / Screening 100 / Screen 1 / Screen 100 ...) ไม่นำมาคิด OEE (A, P, Q, OEE, Pcs/Hr) */
const isScreen = p => /screen/i.test(String(p||''));
function agg(rs){
  let planned=0,run=0,down=0,ideal=0,total=0,good=0,ng=0, oTotal=0,oGood=0;   // total/good/ng = ทุก Process ; oTotal/oGood = เฉพาะที่ไม่ใช่ Screen (ใช้คิด OEE)
  for (const r of rs){
    total+=r.total; good+=r.good; ng+=r.ng;
    if (isScreen(r.proc)) continue;
    planned+=r.planned; run+=r.run; down+=r.down; ideal+=r.total*r.ct/60; oTotal+=r.total; oGood+=r.good;
  }
  const A=planned?run/planned:null, P=run?ideal/run:null, Q=oTotal?oGood/oTotal:null;
  return {n:rs.length,planned,run,down,ideal,total,good,ng,A,P,Q,oee:(A!=null&&P!=null&&Q!=null)?A*P*Q:null,pph:run?oTotal/(run/60):null,ngp:total?ng/total:null};
}
const groupBy = (arr, f) => { const m=new Map(); for (const x of arr){ const k=f(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x);} return m; };
function dateRange(from,to){
  const out=[]; if (!from||!to) return out;
  let d=new Date(from+'T00:00:00Z'); const e=new Date(to+'T00:00:00Z');
  while (d<=e && out.length<800){ out.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()+86400000); }
  return out;
}

/* แหล่งข้อมูลของผลิตภัณฑ์: Sheets API (สด) > CSV ที่เผยแพร่ > ไม่มี (ใช้ไฟล์ที่เลือกเอง) */
function sourceOf(p){
  const su=scriptUrlOf(); if (su) return {type:'script', url:su, token:scriptTokenOf()};
  const key=apiKeyOf(), id=sheetIdOf(p);
  if (key && id) return {type:'api', key, id};
  const u=urlsOf(p); if (u.combinedUrl) return {type:'csv', combinedUrl:u.combinedUrl, planUrl:u.planUrl};
  return null;
}
function syncFilters(p){
  const d=S.data[p]; if (!d||!d.rows.length) return;
  const f=S.filt[p]; if (!f){ initFilters(p); return; }
  let max='0000', min='9999'; for (const r of d.rows){ if (r.date>max) max=r.date; if (r.date<min) min=r.date; }
  const follow = f.to>=f.max;            // เดิมดูถึงวันล่าสุดอยู่ → ขยายตามวันใหม่ที่เข้ามา
  f.min=min; f.max=max; if (follow) f.to=max;
  if (f.to>max) f.to=max; if (f.from<min) f.from=min; if (f.from>f.to) f.from=f.to;
}

function initFilters(p){
  const d=S.data[p]; if (!d||!d.rows.length) return;
  const max=d.rows.reduce((m,r)=>r.date>m?r.date:m,'0000'); const min=d.rows.reduce((m,r)=>r.date<m?r.date:m,'9999');
  const from = max.slice(0,8)+'01';
  S.filt[p]={from: from<min?min:from, to:max, shift:'', dn:'', proc:'', min, max};
}
function filteredRows(opts={}){
  const f=F(); if(!f) return [];
  return D().rows.filter(r => r.date>=f.from && r.date<=f.to && (opts.ignoreShift || ((!f.shift||r.shift===f.shift)&&(!f.dn||r.dn===f.dn))) && (!f.proc||r.proc===f.proc) && xfPass(r,opts.ignoreX));
}
function planVsActual(){
  const f=F(), d=D(); const prod=S.product;
  const act=filteredRows();
  const m=new Map();
  const get=(g,p)=>{ const k=g+'||'+p; if(!m.has(k)) m.set(k,{group:g,part:p,plan:0,actual:0}); return m.get(k); };
  for (const r of act){ get(groupOf(prod,r.proc), normPart(r.part)).actual += r.total; }
  if (d.plan) for (const p of d.plan.rows){
    if (p.date<f.from||p.date>f.to) continue;
    if (f.proc && !(p.procs.includes(f.proc))) continue;
    if (!xfPlanPass(p)) continue;
    get(p.group,p.part).plan += p.qty;
  }
  return [...m.values()];
}
const shiftFiltered = () => { const f=F(); return !!(f && (f.shift||f.dn)); };

/* ---------------------------------------------------------------- loading */
async function fetchCSV(url){
  const u = url + (url.includes('?')?'&':'?') + '_=' + Date.now();
  const res = await fetch(u, {cache:'no-store'});
  if (!res.ok) throw new Error('โหลดไม่สำเร็จ ('+res.status+')');
  return parseCSV(await res.text());
}
async function fetchScript(src, p){
  const u = src.url.split('?')[0] + '?api=dashboard&product=' + encodeURIComponent(p) + (src.token ? '&token=' + encodeURIComponent(src.token) : '');
  let res;
  try{ res = await fetch(u, {cache:'no-store'}); }catch(e){ throw new Error('เชื่อมต่อ Apps Script ไม่ได้ — ตรวจลิงก์ และตั้งสิทธิ์เข้าถึงเป็น “Anyone”'); }
  if (!res.ok) throw new Error('Apps Script ตอบกลับ '+res.status);
  let j; try{ j = await res.json(); }catch(e){ throw new Error('Apps Script ไม่ได้ตอบเป็นข้อมูล — ตรวจว่าใช้ลิงก์ที่ลงท้าย /exec และตั้งสิทธิ์เป็น “Anyone”'); }
  if (j.error) throw new Error(j.error);
  return j;
}
async function apiFetch(url, tab){
  let res;
  try{ res = await fetch(url, {cache:'no-store'}); }catch(e){ throw new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้'); }
  if (!res.ok){
    let msg=''; try{ const j=await res.json(); msg=(j.error&&j.error.message)||''; }catch(e){}
    if (res.status===403) throw new Error('403 ไม่มีสิทธิ์อ่าน — ตรวจว่าแชร์ไฟล์เป็น “ทุกคนที่มีลิงก์ (ผู้ดู)” และ API Key เปิดใช้ Sheets API ไว้');
    if (res.status===404) throw new Error('404 ไม่พบไฟล์ — ตรวจ Spreadsheet ID');
    if (res.status===400 && /parse range|not found/i.test(msg)) throw new Error('ไม่พบแท็บชื่อ “'+tab+'” ในไฟล์');
    if (res.status===400 && /api key/i.test(msg)) throw new Error('API Key ไม่ถูกต้อง');
    if (res.status===429) throw new Error('429 เกินโควตาของ Google — ลองเพิ่มค่า refreshSec');
    throw new Error(res.status+' '+(msg||'โหลดไม่สำเร็จ'));
  }
  return res.json();
}
/* อ่านทั้งแท็บจาก Google Sheets API → array of rows (ข้อความตามที่แสดงในชีต เหมือน CSV) */
async function fetchSheet(id, key, tab){
  const rng = "'" + String(tab).replace(/'/g, "''") + "'";
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(id) + '/values/' + encodeURIComponent(rng)
            + '?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE&key=' + encodeURIComponent(key);
  const j = await apiFetch(url, tab);
  return j.values || [];
}
function hashStr(s){
  let h1=0xdeadbeef^s.length, h2=0x41c6ce57^s.length;
  for (let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)+':'+s.length;
}
const LIVE = {syncing:false, dirty:false, t1:null, t2:null};
function loadProduct(p){
  const slot = S.data[p] = S.data[p] || {rows:[],plan:null};
  if (slot._p) return slot._p;                       // กำลังโหลดอยู่ → ใช้ผลเดียวกัน ไม่ยิงซ้อน
  slot._p = _loadProduct(p, slot).finally(()=>{ slot._p=null; });
  return slot._p;
}
async function _loadProduct(p, slot){
  const src = sourceOf(p); if (!src) return false;
  slot.changed = false;
  try{
    let comb, plan=null, planNote='';
    if (src.type==='script'){
      const j = await fetchScript(src, p); comb = j.combined || []; plan = j.plan || null; planNote = j.planNote || '';
    } else if (src.type==='api'){
      const tabs = CONFIG.sheetNames;
      [comb, plan] = await Promise.all([
        fetchSheet(src.id, src.key, tabs.combined),
        fetchSheet(src.id, src.key, tabs.plan).catch(e=>{ planNote=e.message; return null; })
      ]);
    } else {
      comb = await fetchCSV(src.combinedUrl);
      plan = src.planUrl ? await fetchCSV(src.planUrl) : null;
    }
    const sig = hashStr(JSON.stringify(comb)) + '|' + hashStr(JSON.stringify(plan));
    const changed = slot.sig!==sig || !slot.rows.length;
    if (changed){                                    // แปลงข้อมูลใหม่เฉพาะเมื่อชีตเปลี่ยนจริง
      const rows = buildCombined(comb);
      const pl = (plan && plan.length) ? buildPlan(plan, p) : null;
      slot.rows = rows; slot.plan = pl; slot.sig = sig;
    }
    slot.error = ''; slot.planNote = planNote; slot.at = new Date(); slot.changed = changed;
    slot.source = src.type==='script' ? 'Apps Script' : src.type==='api' ? 'Google Sheets' : 'ลิงก์ CSV';
    if (changed) syncFilters(p);
    return true;
  }catch(e){ slot.error = String(e.message||e); return false; }   // ถ้าพลาด คงข้อมูลเดิมไว้ แล้วลองใหม่รอบหน้า
}

/* ---------------------------------------------------------------- live refresh */
const hms = d => d.toTimeString().slice(0,8);
function liveHTML(){
  const p=S.product, d=D(), src=sourceOf(p); const has=!!(d&&d.rows&&d.rows.length);
  if (LIVE.syncing) return '<span class="dot sync"></span><span>กำลังซิงก์…</span>';
  if (!src) return has ? `<span class="dot"></span><span>ข้อมูลจากไฟล์${d.at?' · '+hms(d.at):''}<br>ไม่ได้ต่อสด</span>` : '<span class="dot"></span><span>ยังไม่ได้เชื่อมต่อ</span>';
  if (d&&d.error) return `<span class="dot bad"></span><span>เชื่อมต่อไม่ได้ ใช้ข้อมูลเดิม${d.at?'<br>(ล่าสุด '+hms(d.at)+')':''}</span>`;
  if (d&&d.at) return `<span class="dot ok"></span><span>${src.type!=='csv'?'เชื่อมต่อแล้ว':'ลิงก์ CSV'}<br>อัปเดต ${hms(d.at)}</span>`;
  return '<span class="dot sync"></span><span>กำลังโหลด…</span>';
}
function updateLive(){ const el=$('#liveInd'); if (el) el.innerHTML=liveHTML(); }
function tryRender(){
  if (S.page==='data') return;                       // ไม่ล้างช่องที่กำลังพิมพ์ในหน้าตั้งค่า
  const a=document.activeElement; const fb=$('#filters');
  if (a && fb && fb.contains(a)) return;             // กำลังแก้ตัวกรองอยู่ ไว้รอบหน้า
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
async function liveTick(bg){
  if (document.hidden) return;
  if (bg){
    for (const p of Object.keys(CONFIG.products)) if (p!==S.product && sourceOf(p)) await loadProduct(p);
    return;
  }
  const p=S.product; if (!sourceOf(p)) return;
  LIVE.syncing=true; updateLive();
  await loadProduct(p);
  LIVE.syncing=false; updateLive();
  const d=S.data[p]; if (d && d.changed) LIVE.dirty=true;
  if (LIVE.dirty && p===S.product) tryRender();
}
function startLive(){
  clearInterval(LIVE.t1); clearInterval(LIVE.t2);
  const sec=refreshSec();
  if (sec>0) LIVE.t1=setInterval(()=>liveTick(false), sec*1000);
  if (sec>0 && CONFIG.bgRefreshSec>0) LIVE.t2=setInterval(()=>liveTick(true), Math.max(30,CONFIG.bgRefreshSec)*1000);
  document.addEventListener('visibilitychange',()=>{ if (!document.hidden){ const d=D(), lim=(refreshSec()||3600)*1000; if (!d||!d.at||Date.now()-d.at>lim) liveTick(false); } });
}
function sheetAoa(wb, wanted){
  const name = wb.SheetNames.find(n=>n.trim().toLowerCase()===wanted.toLowerCase());
  if (!name) return null;
  return XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
}
async function loadFile(p, file){
  const slot = S.data[p] = S.data[p] || {rows:[],plan:null};
  try{
    if (/\.csv$/i.test(file.name)){
      const aoa = parseCSV(await file.text());
      if (aoa[0] && aoa[0].map(x=>String(x).trim()).includes('RecordID')) slot.rows = buildCombined(aoa);
      else slot.plan = buildPlan(aoa,p);
    } else {
      if (typeof XLSX==='undefined') throw new Error('ไม่พบไลบรารีอ่าน .xlsx (ต้องออนไลน์ครั้งแรก)');
      const buf = await file.arrayBuffer();
      const names = XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames;
      const pick = names.filter(n=>['combined','input plan'].includes(n.trim().toLowerCase()));
      if (!pick.length) throw new Error('ไม่พบชีต Combined ในไฟล์');
      const wb = XLSX.read(buf,{type:'array',sheets:pick,cellDates:false});
      slot.rows = buildCombined(sheetAoa(wb,'Combined'));
      const pa = sheetAoa(wb,'Input plan'); slot.plan = pa ? buildPlan(pa,p) : null;
    }
    slot.source='ไฟล์ '+file.name; slot.error=''; slot.at=new Date(); slot.sig=''; slot.planNote='';
    initFilters(p);
    return true;
  }catch(e){ slot.error=String(e.message||e); return false; }
}

/* แสดงค่าบนทุกกราฟอัตโนมัติ (แท่งเดี่ยว/แท่งคู่/แท่งซ้อน/เส้น) — กราฟที่มี barLabels เฉพาะของตัวเองอยู่แล้วจะไม่ถูกวาดซ้ำ */

    let r,g,b,al=1; if(m[1]){ const k=parseInt(m[1],16); r=k>>16; g=(k>>8)&255; b=k&255; } else { r=+m[2]; g=+m[3]; b=+m[4]; if(m[5]!=null) al=+m[5]; }
    if (al<.9) return ink; return (0.299*r+0.587*g+0.114*b)>150?'#0b0b0b':'#ffffff'; };
  const put=(t,x,y,o)=>{ ctx.save(); ctx.font=(o.bold?'700 ':'600 ')+FS+'px '+FONT; ctx.translate(x,y); if(o.rot) ctx.rotate(-Math.PI/2);
    ctx.textAlign=o.align||'center'; ctx.textBaseline=o.base||'middle';

      if (inside){ if (fit) put(t,p.x,end+(up?4:-4),{color:col,base:up?'top':'bottom'}); else put(t,p.x,end+(up?4:-4),{color:col,rot:true,align:up?'right':'left'}); }

function xfPass(r, ignore){
  const x=S.xf;
  if (ignore!=='date' && x.dates.size && !x.dates.has(r.date)) return false;
  if (ignore!=='proc' && x.procs.size && !x.procs.has(r.proc)) return false;
  return true;
}
function xfPlanPass(p, ignore){
  const x=S.xf;
  if (ignore!=='date' && x.dates.size && !x.dates.has(p.date)) return false;
  if (ignore!=='proc' && x.procs.size && !p.procs.some(q=>x.procs.has(q))) return false;
  return true;
}
const xfActive = () => S.xf.dates.size>0 || S.xf.procs.size>0 || S.lossCat!=='all';
function xfSel(dim,v){ return dim==='date' ? S.xf.dates.has(v) : dim==='proc' ? S.xf.procs.has(v) : S.lossCat===v; }
function dimHex(c){
  const m=/^#([0-9a-f]{6})$/i.exec(String(c||'').trim()); if (!m) return c;
  const n=parseInt(m[1],16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+',.28)';
}
function toggleXF(dim,v){
  setTimeout(()=>{                                  // รอให้ Chart.js จัดการคลิกเสร็จก่อนค่อยวาดใหม่
    const x=S.xf;
    if (dim==='cat') S.lossCat = S.lossCat===v ? 'all' : v;
    else { const set=dim==='date'?x.dates:x.procs; if (set.has(v)) set.delete(v); else set.add(v); }
    const y=window.scrollY; render(); window.scrollTo(0,y);
  },0);
}
/* ผูกกราฟกับมิติ: dim = 'date' | 'proc' | 'cat', values[i] = ค่าของแท่งที่ i */
function xfBind(id,dim,values){
  const el=$('#c-'+id); if (!el || typeof Chart==='undefined' || !Chart.getChart) return;
  const ch=Chart.getChart(el); if (!ch) return;
  ch.options.onClick=(e,els)=>{ if (!els||!els.length) return; const v=values[els[0].index]; if (v!=null) toggleXF(dim,v); };
  ch.options.onHover=(e,els)=>{ const t=e.native&&e.native.target; if (t) t.style.cursor=(els&&els.length)?'pointer':'default'; };
  if (values.some(v=>xfSel(dim,v))){                 // จางแท่งที่ไม่ได้เลือก
    ch.data.datasets.forEach(ds=>{
      if (ds.type==='line') return; const base=ds.backgroundColor;
      ds.backgroundColor=values.map((v,i)=>{ const c=Array.isArray(base)?base[i]:base; return xfSel(dim,v)?c:dimHex(c); });
    });
  }

}

function statusOf(v,target){ if(v==null||!isFinite(v)) return ''; const x=Math.round(v*10000)/100; return x<target?'st-red':(x>100?'st-yellow':'st-green'); }
/* สี % ผลิตได้ตามแผน: ≤95 แดง · มากกว่า 95 ถึงน้อยกว่า 105 เขียว (96–104) · ≥105 เหลือง */

  $('#view').innerHTML=titleHTML('ข้อมูลและเป้าหมาย').replace(/<span>.*<\/span>/,'')+`
   <div class="grid g2" style="margin-bottom:14px">
   <section class="card"><h3>เป้าหมาย (%)</h3>
     <div class="form-row">${[['oee','OEE'],['a','Availability'],['p','Performance'],['q','Quality']].map(([k,t])=>`<label class="fld">${t}<input type="number" min="0" max="100" step="0.5" data-t="${k}" value="${T[k]}" style="min-width:90px"></label>`).join('')}</div></section>
   <section class="card"><h3>การเชื่อมต่อข้อมูล</h3>
     <div class="form-row"><label class="fld" style="flex:1">Apps Script URL<input type="url" data-surl="1" value="${esc(scriptUrlOf())}" placeholder="https://script.google.com/macros/s/…/exec" style="width:100%" autocomplete="off"></label></div>
     <div class="form-row"><label class="fld" style="flex:1">รหัสผ่านเข้าถึง<input type="password" data-stoken="1" value="${esc(scriptTokenOf())}" style="width:100%" autocomplete="off"></label></div>
     <div class="form-row"><label class="fld" style="flex:1">Google API Key<input type="password" data-key="1" value="${esc(apiKeyOf())}" placeholder="AIza…" style="width:100%" autocomplete="off"></label><button class="btn primary" id="connectAll">เชื่อมต่อและโหลดทั้งหมด</button></div></section></div>
   <div class="grid g2">${blocks}</div>`;
  $$('[data-t]').forEach(i=>i.onchange=()=>{S.targets[i.dataset.t]=+i.value||0; store.set('oee.targets',S.targets);});
  $$('[data-u]').forEach(i=>i.onchange=()=>{const [p,k]=i.dataset.u.split(':'); S.urls[p]=Object.assign({},S.urls[p],{[k]:i.value.trim()}); store.set('oee.urls',S.urls);});
  $$('[data-surl]').forEach(i=>i.onchange=()=>{S.api.scriptUrl=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-stoken]').forEach(i=>i.onchange=()=>{S.api.token=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-key]').forEach(i=>i.onchange=()=>{S.api.key=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-sid]').forEach(i=>i.onchange=()=>{S.api.ids=S.api.ids||{}; S.api.ids[i.dataset.sid]=i.value.trim(); store.set('oee.api',S.api);});
  const ca=$('#connectAll'); if (ca) ca.onclick=async()=>{ ca.textContent='กำลังโหลด…'; await Promise.all(Object.keys(CONFIG.products).map(p=>loadProduct(p))); render(); };
  $$('[data-load]').forEach(b=>b.onclick=async()=>{const p=b.dataset.load; b.textContent='กำลังโหลด…'; await loadProduct(p); render();});
  $$('[data-file]').forEach(i=>i.onchange=async()=>{ if(i.files[0]){ await loadFile(i.dataset.file,i.files[0]); render(); }});
}
function pageEmpty(){
  $('#view').innerHTML=titleHTML('ยังไม่มีข้อมูล').replace(/<span>.*<\/span>/,'')+`<div class="card empty"><h2>${S.product} ยังไม่มีข้อมูล</h2>
   <div class="form-row" style="justify-content:center"><button class="btn primary" id="goData">ไปหน้าตั้งค่าข้อมูล</button><label class="btn">เลือกไฟล์ .xlsx / .csv<input type="file" accept=".xlsx,.xlsm,.csv" id="quickFile" hidden></label></div>
   ${D()&&D().error?`<p class="status bad">ผิดพลาด: ${esc(D().error)}</p>`:''}</div>`;
  $('#goData').onclick=()=>{S.page='data';render();};
  $('#quickFile').onchange=async e=>{ if(e.target.files[0]){ await loadFile(S.product,e.target.files[0]); render(); }};
}

/* ---------------------------------------------------------------- render */
const PAGEFN={overview:pageOverview,oee:pageOEE,loss:pageLoss,ng:pageNG,plan:pagePlan,data:pageData};
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  if (typeof Chart!=='undefined'){ Chart.defaults.font.family=FONT; Chart.defaults.color=cv('--ink2'); }
  $('#banner').innerHTML = typeof Chart==='undefined' ? `<div class="warn">โหลดไลบรารีกราฟ (Chart.js) ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต</div>` : '';
  renderRail(); renderFilters(); renderXF();
  if (S.page!=='data' && !hasData()) pageEmpty(); else PAGEFN[S.page]();
  document.title = S.product+' · '+trl('แผงติดตามการผลิต')+' OEE';
  LIVE.dirty=false;
}

/* ===== Motion layer: odometer scoreboard + entrance animations ===== */
(function(){
  const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ODO={}; let lastKey=null; const SPINS=2, REEL=(SPINS+1)*10;
  const reel=()=>{let h='';for(let k=0;k<REEL;k++)h+='<i>'+(k%10)+'</i>';return h;};

  function odoBuild(text,prev){
    const o=document.createElement('span'); o.className='od'; o.setAttribute('aria-hidden','true');
    const n=text.length, pn=prev==null?0:prev.length, jobs=[];
    let right=0;
    for(let i=n-1;i>=0;i--){
      const ch=text[i]; let el;
      if(!/\d/.test(ch)){ el=document.createElement('span'); el.textContent=ch; o.insertBefore(el,o.firstChild); continue; }
      const pc=prev==null?undefined:prev[i-(n-pn)];
      const to=+ch, from=/\d/.test(pc||'')?+pc:0;
      const changed=prev==null||pc!==ch;
      const d=document.createElement('span'); d.className='od-d';
      const r=document.createElement('span'); r.className='od-r'; r.innerHTML=reel();
      const startI=from, endI=changed?SPINS*10+to:to;
      r.style.transition='none'; r.style.transform='translateY(-'+(startI*1.15)+'em)';
      r.style.setProperty('--od-delay',(right*0.07)+'s'); r.style.setProperty('--od-dur',(1.1+right*0.12)+'s');
      d.appendChild(r); o.insertBefore(d,o.firstChild);
      jobs.push([r,endI,changed]); right++;
    }
    return {o,jobs};
  }

  function odoRun(prefix,enter){
    if(reduce()) return;
    const all=[];
    document.querySelectorAll('#view .kpi .val').forEach(v=>{
      const lbl=(v.parentElement.querySelector('.lbl')||{}).textContent||'';
      const key=prefix+lbl;
      const node=[...v.childNodes].find(x=>x.nodeType===3&&/\d/.test(x.textContent));
      if(!node){ delete ODO[key]; return; }
      const m=node.textContent.match(/\S+/); if(!m) return;
      const text=m[0], prev=ODO[key]; ODO[key]=text;
      if(prev===text&&!enter) return;            // unchanged on live refresh: leave as is
      v.setAttribute('aria-label',v.textContent.trim());
      const {o,jobs}=odoBuild(text,enter||prev===undefined?null:prev);
      node.textContent=node.textContent.replace(text,'');
      v.insertBefore(o,node);
      if(!enter&&prev!==undefined&&prev!==text){ v.classList.add('od-flash'); setTimeout(()=>v.classList.remove('od-flash'),1200); }
      all.push(...jobs);
    });
    if(!all.length) return;
    void document.body.offsetHeight;              // commit start positions
    requestAnimationFrame(()=>all.forEach(([r,endI])=>{ r.style.transition=''; r.style.transform='translateY(-'+(endI*1.15)+'em)'; }));
  }

  function enterRun(){
    const v=document.getElementById('view'); if(!v||reduce()) return;
    v.querySelectorAll('.card').forEach((c,i)=>c.style.setProperty('--i',Math.min(i,14)));
    v.classList.remove('view-enter'); void v.offsetWidth; v.classList.add('view-enter');
    clearTimeout(enterRun.t); enterRun.t=setTimeout(()=>v.classList.remove('view-enter'),1600);
  }

  const _render=render;
  render=function(){
    const key=S.product+'|'+S.page, enter=key!==lastKey; lastKey=key;
    if(typeof Chart!=='undefined'&&!reduce()){
      const A=Chart.defaults.animation;   // mutate in place; replacing the object breaks Chart.js internals
      A.duration=enter?1100:450; A.easing='easeOutQuart';
      A.delay=c=>(enter&&c&&c.type==='data'&&c.mode==='default')?Math.min(c.dataIndex||0,60)*14:0;
    }
    _render();
    if(enter) enterRun();
    odoRun(key+'|',enter);
  };
})();
/* ---------------- Drawer: ย่อ/ขยาย (จอใหญ่) · เลื่อนเข้า-ออก (จอเล็ก) ---------------- */
function setRailMini(on){
  document.body.classList.toggle('rail-mini',on); store.set('oee.railMini',on);
  const t=$('#railToggle'); if (t){ t.textContent=on?'›':'‹'; t.setAttribute('aria-expanded',String(!on)); const l=on?'ขยายเมนู':'ย่อเมนู'; t.setAttribute('aria-label',l); t.title=l; }
}
function setDrawer(open){
  document.body.classList.toggle('drawer-open',open);
  const f=$('#drawerOpen'); if (f) f.setAttribute('aria-expanded',String(open));
}
document.body.classList.toggle('rail-mini', !!store.get('oee.railMini',false));
$('#drawerOpen').onclick=()=>setDrawer(!document.body.classList.contains('drawer-open'));
$('#scrim').onclick=()=>setDrawer(false);
document.addEventListener('keydown',e=>{ if (e.key==='Escape') setDrawer(false); });
$('#rail').addEventListener('click',e=>{ if (e.target.closest('[data-prod],[data-page]')) setDrawer(false); });   // เลือกเมนูแล้วปิด drawer บนมือถือ
(async function boot(){
  applyTheme(); document.documentElement.lang=LANG; applyStaticLang(); i18nStart();
  const loads=Object.keys(CONFIG.products).map(p=>loadProduct(p));
  render();
  await Promise.all(loads);
  if (!hasData()) S.page = hasData()? S.page : 'overview';
  render();
  startLive();
  window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
})();
</script>
