<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผงติดตามการผลิต OEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.045);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#898781; --plan:#b9b8b0;
  --good:#006300; --crit:#c23030; --pos:#2a78d6; --neg:#e34948;
  --rail:#0d366b; --rail-ink:#e8eefb; --rail-dim:#9fb4d8; --rail-hi:#1c5cab;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --plan:#5d5c57;
    --good:#0ca30c; --crit:#e66767; --pos:#3987e5; --neg:#e66767;
    --rail:#11161c; --rail-hi:#1f2a38;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --plan:#5d5c57;
  --good:#0ca30c; --crit:#e66767; --pos:#3987e5; --neg:#e66767;
  --rail:#11161c; --rail-hi:#1f2a38;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 14px/1.5 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:17px;line-height:1.25;padding:2px 8px 14px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--rail-dim);margin-top:2px}
.rail h2{font-size:12px;font-weight:500;color:var(--rail-dim);margin:14px 8px 4px}
.rail button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--rail-ink);cursor:pointer;display:flex;flex-direction:column;gap:0;width:100%}
.rail button:hover{background:rgba(255,255,255,.08)}
.rail button[aria-current="true"]{background:var(--rail-hi)}
.rail button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,th button:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
.rail .code{font-weight:600}
.rail .full{font-size:12px;color:var(--rail-dim)}
.rail .nav button{flex-direction:row;align-items:center;gap:8px}
.rail .spacer{flex:1}
.rail .foot{font-size:12px;color:var(--rail-dim);padding:8px}
.main{padding:18px 24px 48px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.fld input,.fld select{background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 8px;color:var(--ink);min-width:130px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.page-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.page-title h1{font-size:20px;margin:0;font-weight:700}
.page-title span{color:var(--ink2);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin:0}
.card .sub{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.chartbox{position:relative}
.chartbox canvas{max-width:100%}
.kpi{padding:12px 14px}
.kpi .lbl{font-size:12px;color:var(--ink2)}
.kpi .val{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.kpi .gap{font-size:12px;margin-top:4px;color:var(--ink2)}
.up{color:var(--good);font-weight:600}
.down{color:var(--crit);font-weight:600}
.kpis{margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--surface)}
th button{background:none;border:0;cursor:pointer;font-weight:600;color:var(--ink2);padding:0;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:560px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);border:1px solid var(--axis);border-radius:999px;padding:2px 10px;background:var(--plane);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink2);color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.warn{background:var(--wash);border-left:3px solid var(--s4);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.empty{padding:40px 24px;text-align:center}
.empty h2{margin:0 0 6px;font-size:18px}
.tbl{display:none;margin-top:8px}
.card.showtbl .tbl{display:block}
.card.showtbl .chartbox{display:none}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}
.form-row input[type=text],.form-row input[type=url]{flex:1;min-width:260px;background:var(--plane);border:1px solid var(--axis);border-radius:8px;padding:6px 8px;color:var(--ink)}
.status{font-size:12px;color:var(--ink2)}
.status.ok{color:var(--good)} .status.bad{color:var(--crit)}
code{background:var(--wash);padding:1px 5px;border-radius:4px;font-size:12px}
/* cross-filter */
#xfbar .xf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:8px 12px;background:var(--surface);border:1px solid var(--s1);border-radius:12px;position:sticky;top:8px;z-index:20}
#xfbar .xf-l{font-size:12px;color:var(--ink2);font-weight:600}
#xfbar .chip b{font-weight:600;color:var(--ink)}
#xfbar .hint{margin:-6px 0 12px}
/* live status */
.rail .live{font-size:12px;color:var(--rail-dim);padding:6px 8px;display:flex;align-items:flex-start;gap:8px;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:#898781}
.dot.ok{background:#3ddc97;animation:pulse 2s infinite}
.dot.sync{background:#f2b632}
.dot.bad{background:#ff7a7a}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
@media (prefers-reduced-motion:reduce){.dot.ok{animation:none}}
details summary{cursor:pointer}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .rail h2,.rail .foot,.rail .spacer,.rail .full{display:none}
  .rail .live{padding:0 8px}
  #themeBtn{margin-left:auto}
  .brand{padding:0 8px;flex-basis:100%}
  .rail button{width:auto}
  .main{padding:14px 16px 40px}
  .g2{grid-template-columns:1fr}
  .fld input,.fld select{min-width:110px}
}
@media (max-width:520px){.g4,.g5{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="เมนูหลัก"></aside>
  <main class="main">
    <div id="banner"></div>
    <div id="filters"></div>
    <div id="xfbar"></div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
/* =====================================================================
   ตั้งค่า (แก้ได้ที่นี่ หรือกรอกในหน้า "ข้อมูลและเป้าหมาย" ก็ได้ ระบบจะจำไว้ในเบราว์เซอร์นั้น)

   เชื่อมต่อแบบเรียลไทม์ (แนะนำ) ใช้ Google Sheets API:
     1) Google Cloud Console → สร้างโปรเจกต์ → เปิดใช้ "Google Sheets API"
        → Credentials → Create API key (จำกัดให้ใช้ได้เฉพาะ Sheets API)
     2) ในไฟล์ Sheets ทั้ง 4 ไฟล์: Share → General access → "Anyone with the link" → Viewer
     3) ใส่ apiKey ด้านล่าง และ sheetId ของแต่ละผลิตภัณฑ์
        (sheetId คือข้อความระหว่าง /d/ กับ /edit ในลิงก์ของไฟล์ หรือวางลิงก์เต็มก็ได้)
   ถ้าใส่ไว้ในไฟล์นี้ ทุกเครื่องที่เปิดแดชบอร์ดจะเชื่อมต่อได้ทันทีโดยไม่ต้องกรอกเอง

   ไม่อยากใช้ Cloud Console: ใช้ Apps Script (ไฟล์ DashboardAPI.gs) แล้วใส่ scriptUrl กับ scriptToken แทน

   ทางเลือกเดิม: Publish to web เป็น CSV แล้ววางลิงก์ในหน้า "ข้อมูลและเป้าหมาย" (ช้ากว่า ~5 นาที)
   ===================================================================== */
const CONFIG = {
  scriptUrl: 'https://script.google.com/macros/s/AKfycbzhRcRvc6z2Ka779ElFeNyUn6M3J-UJ6FhFy05N8LL32XnjQOrdm6b2xDhiUmXGwQi45Q/exec',              // ลิงก์เว็บแอป Apps Script (ลงท้าย /exec) — ไม่ต้องใช้ API Key และไม่ต้องแชร์ชีตเป็นสาธารณะ ถ้าใส่ช่องนี้จะใช้ช่องทางนี้ก่อน
  scriptToken: 'mironu-oee-dashboard-3009',            // รหัสผ่านที่ตั้งไว้ใน Script properties (DASH_TOKEN) ของ Apps Script
  apiKey: '',                 // Google API Key (ว่างไว้ได้ ถ้าจะกรอกในหน้า "ข้อมูลและเป้าหมาย")
  refreshSec: 30,             // ดึงข้อมูลผลิตภัณฑ์ที่เปิดอยู่ทุกกี่วินาที (0 = ปิด, ต่ำสุด 10)
  bgRefreshSec: 300,          // ดึงข้อมูลผลิตภัณฑ์อื่นที่ไม่ได้เปิดอยู่ทุกกี่วินาที (0 = ปิด)
  sheetNames: { combined: 'Combined', plan: 'Input plan' },   // ชื่อแท็บในแต่ละไฟล์ Sheets
  targets: { oee: 85, a: 90, p: 95, q: 99 },   // เป้าหมาย % (แก้ได้ในหน้า "ข้อมูล")
  products: {
    SOP: { name: 'Shaft Oil Pump', sheetId: '1CsYo5t9JQ4vMLh_ShrjsLBeb93hOmwf1Fbkg2T8iGS4', combinedUrl: '', planUrl: '' },
    SWP: { name: 'Shaft Water Pump', sheetId: '1q8WR5LP7r1Vw1jjWaL-yiMDd5B0k5pTAdrUzZYKzYhQ', combinedUrl: '', planUrl: '' },
    VBA: { name: 'Valve Booster Air', sheetId: '1OW00Qc4M4XcnbiWKDS1rahaL6C5ii2im2ENLu_UNX_M', combinedUrl: '', planUrl: '' },
    VOP: { name: 'Valve Oil Pump', sheetId: '1gn3Ny6CxoU6I1gpz7BVBl2Lb6EfQn3Le-whsvFVQvWY', combinedUrl: '', planUrl: '' }
  },
  /* จับคู่ "หัวคอลัมน์ใน Input plan (ไม่รวมเลข Part ท้ายสุด)" → ชื่อ Process ที่อยู่ในชีต Combined
     ถ้ามี Process ใหม่ ให้เพิ่มบรรทัดที่นี่ */
  planMap: {"SOP":{"Lathe 1 Auto (B08-0001)":["Lathe Auto (B08-01)"],"Lathe 1 Auto (B12-0028)":["Lathe Auto (B12-28)"],"Lathe 1 Auto (B1200028)":["Lathe Auto (B12-28)"],"Lathe 1 Auto (B12-0024)":["Lathe Auto (B12-24)"],"Lathe 1 Auto (B12-0013)":["Lathe Auto (B12-13)"],"Cold Forging":["Cold Forging (SOP)"],"Lathe 1,2 SOP Set1":["Lathe SOP (Set 1)"],"Lathe 1,2 SOP Set2":["Lathe SOP (Set 2)"],"Lathe 1,2,3 SOP Set6":["Lathe SOP (Set 6)"],"Lathe 2,3 SOP Set7":["Lathe SOP (Set 7)"],"Rolling":["Roll Slit SOP"],"Screening 1":["Screening 1 SOP"],"Grinding 1,2 SOP Set3":["Grinding SOP (Set 3)"],"Grinding 1,2 SOP Set4":["Grinding SOP (Set 4)"],"Grinding 1,2 SOP Set5":["Grinding SOP (Set 5)"],"Grinding 1,2 SOP Set6":["Grinding SOP (Set 6)"],"Grinding 1,2 SOP Set7":["Grinding SOP (Set 7)"],"Grinding 1":["Gr 1 11070 11090"],"Grinding 2":["Gr 2 11070 11090"],"Screening 100":["Screening 100 SOP"],"KRT Induction \"S\"":["Induction"],"KRT Induction \"L\"":["Induction"]},"SWP":{"Milling":["Milling Small SWP"],"Duburring":["Deburring Small SWP"],"Grinding":["Grinding Small SWP"],"Grinding (Set1)":["Grinding 1 SWP (Set 1)"],"Grinding (Set2)":["Grinding 1 SWP (Set 2)"],"Lathe 1,2 + Gr 2 (Set 1)":["Lathe 1,2 + Gr 2 (Set 1)"],"Lathe 1,2 + Gr 2 (Set 2)":["Lathe 1,2 + Gr 2 (Set 2)"],"Lathe 1,2 + Gr 2 (Set 3)":["Lathe 1,2 + Gr 2 (Set 3)"],"Lathe 1,2 + Gr 2 (Set 4)":["Lathe 1,2 + Gr 2 (Set 4)"],"Screening 100 SWP":["Screening 100 SWP","Screening 100 SWP (Change Box)"]},"VBA":{"B13-0011":["Lathe OP1 (B13-11)"],"B15-0002":["Lathe OP1 (B15-02)"],"B12-0001":["Lathe OP1 (B12-01)"],"B23-0016":["Lathe OP1 (B23-16)"],"B23-0017":["Lathe OP1 (B23-17)"],"B15-0003":["Lathe OP1 (B15-03)"],"B10-0015":["Lathe OP1 (B10-15)"],"B11-0032":["Lathe OP2 (B11-32)"],"B07-0004":["Lathe OP2 (B07-04)"],"B12-0023":["Lathe OP2 (B12-23)"],"B12-0029":["Lathe OP2 (B12-29)"],"B07-0007":["Lathe OP2 (B07-07)"],"B05-0007":["Lathe OP2 (B05-07)"],"Screen 1":["Screening 1 VBA","Screening 1 VBA (Plunger)"],"Screen 100":["Screening 100 VBA"]},"VOP":{"B22-0001":["Lathe Auto (B22-01)"],"B23-0001":["Lathe Auto (B23-01)"],"B17-0016":["Lathe Auto (B17-16)"],"B13-0010":["Lathe 1,2 (10230)"],"B13-0006":["Lathe Auto (B13-06)"],"Drilling":["Drilling (10290)"],"Deburring":["Deburring (10290)"],"Grinding 1,2":["Grinding 1","Grinding 2"],"Grinding 3":["Grinding 3"],"Screening 100":["Screening 100 VOP"]}}
};

/* ---------------------------------------------------------------- helpers */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const EN_M = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const fmtD = (iso, y=false) => { const [Y,M,D]=iso.split('-').map(Number); return `${D} ${TH_M[M-1]}${y?' '+Y:''}`; };
const nf = (v, d=0) => v==null || !isFinite(v) ? '–' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v, d=2) => v==null || !isFinite(v) ? '–' : (v*100).toFixed(d)+'%';
const store = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function num(v){
  if (v==null || v==='') return 0;
  if (typeof v==='number') return isFinite(v)? v : 0;
  let s=String(v).trim().replace(/,/g,'');
  if (s.endsWith('%')) { const n=parseFloat(s); return isFinite(n)? n/100 : 0; }
  const n=parseFloat(s); return isFinite(n)? n : 0;
}
const pad = n => String(n).padStart(2,'0');
function parseDate(v){
  if (v==null || v==='') return null;
  if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if (typeof v==='number'){ if (v<20000||v>80000) return null; const d=new Date(Math.round((Math.floor(v)-25569)*86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s=String(v).trim(); let m;
  if ((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{4})/))) { const mo=EN_M[m[2].toLowerCase()]; if (mo) return `${m[3]}-${pad(mo)}-${pad(m[1])}`; }
  if ((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) { let a=+m[1], b=+m[2]; if (b>12){ [a,b]=[b,a]; } return `${m[3]}-${pad(b)}-${pad(a)}`; }
  return null;
}
const normPart = p => { let s=String(p??'').trim(); if (/^\d+\.0$/.test(s)) s=s.slice(0,-2); return s.replace(/\(.*?\)/g,'').replace(/\s+/g,'').toUpperCase(); };
const normLabel = h => String(h??'').replace(/\s+/g,' ').trim();
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cur); cur=''; }
    else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if (c==='\r'){}
    else cur+=c;
  }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
const catShort = c => ({ 'PD Production':'PD','PC Production Control':'PC','QC Quality Control':'QC','MT Maintenance':'MT','Plan':'Plan' })[c] || c.split(' ')[0];
const CATS = [
  {k:'PD', name:'PD Production', col:'--s1'},
  {k:'QC', name:'QC Quality Control', col:'--s2'},
  {k:'MT', name:'MT Maintenance', col:'--s3'},
  {k:'PC', name:'PC Production Control', col:'--s4'},
  {k:'Plan', name:'Plan (ไม่มีแผน/อบรม/ประชุม)', col:'--s5'}
];

/* ---------------------------------------------------------------- data model */
function buildCombined(aoa){
  if (!aoa || aoa.length<2) throw new Error('ชีต Combined ว่างเปล่า');
  const H = aoa[0].map(h => String(h??'').trim());
  const ix = n => H.indexOf(n);
  const need = {id:'RecordID',date:'Date',shift:'Shift',proc:'Process',part:'PartNumber',planned:'Planned Time (min)',run:'Run Time (min)',down:'Downtime (min)',ct:'Ideal Cycle Time (sec)',total:'Total Pcs',good:'Good Pcs',ng:'NG Pcs'};
  const c = {}; const missing=[];
  for (const [k,n] of Object.entries(need)){ c[k]=ix(n); if (c[k]<0) missing.push(n); }
  if (missing.length) throw new Error('ไม่พบคอลัมน์: '+missing.join(', ')+' (ต้องเป็นชีต Combined)');
  c.dn = ix('DayNight');
  const lossCols=[], ngCols=[];
  H.forEach((h,i)=>{
    if (h.startsWith('Loss: ')){ const [cat,...r]=h.slice(6).split(' | '); lossCols.push({i,cat:catShort(cat.trim()),reason:r.join(' | ').trim()}); }
    else if (h.startsWith('NG: ')) ngCols.push({i,label:h.slice(4).trim()});
  });
  const out=[]; let skipped=0, skippedPcs=0;
  for (let r=1;r<aoa.length;r++){
    const row=aoa[r]; if (!row || row[c.id]==null || row[c.id]==='') continue;
    const date=parseDate(row[c.date]);
    if (!date){ const pcs=num(row[c.total]); if (pcs>0){ skipped++; skippedPcs+=pcs; } continue; }
    const rec={ date, shift:String(row[c.shift]??'').trim(), dn:c.dn>=0?String(row[c.dn]??'').trim():'', proc:String(row[c.proc]??'').trim(), part:String(row[c.part]??'').trim(),
      planned:num(row[c.planned]), run:num(row[c.run]), down:num(row[c.down]), ct:num(row[c.ct]), total:num(row[c.total]), good:num(row[c.good]), ng:num(row[c.ng]),
      loss:{}, reasons:{}, ngt:{} };
    for (const L of lossCols){ const v=num(row[L.i]); if (v){ rec.loss[L.cat]=(rec.loss[L.cat]||0)+v; const k=L.cat+'|'+L.reason; rec.reasons[k]=(rec.reasons[k]||0)+v; } }
    for (const N of ngCols){ const v=num(row[N.i]); if (v) rec.ngt[N.label]=(rec.ngt[N.label]||0)+v; }

function buildPlan(aoa, product){

    const row=aoa[r]; const date=parseDate(row[0]); if (!date) continue;
    for (let j=1;j<H.length;j++){
      const h=H[j]; if (!h || h==='Total') continue;

      const m=h.match(/^(.*?)\s+(\S+)$/); const label=m?m[1]:h; let part=m?m[2]:'';

}

function syncFilters(p){

  let max='0000', min='9999'; for (const r of d.rows){ if (r.date>max) max=r.date; if (r.date<min) min=r.date; }
  const follow = f.to>=f.max;            // เดิมดูถึงวันล่าสุดอยู่ → ขยายตามวันใหม่ที่เข้ามา
  f.min=min; f.max=max; if (follow) f.to=max;

function initFilters(p){

/* ---------------------------------------------------------------- loading */
async function fetchCSV(url){
  const u = url + (url.includes('?')?'&':'?') + '_=' + Date.now();
  const res = await fetch(u, {cache:'no-store'});
  if (!res.ok) throw new Error('โหลดไม่สำเร็จ ('+res.status+')');
  return parseCSV(await res.text());
}
async function fetchScript(src, p){
  const u = src.url + (src.url.includes('?')?'&':'?') + 'api=dashboard&product=' + encodeURIComponent(p) + (src.token ? '&token=' + encodeURIComponent(src.token) : '');
  let res;

  if (!res.ok) throw new Error('Apps Script ตอบกลับ '+res.status);
  let j; try{ j = await res.json(); }catch(e){ throw new Error('Apps Script ไม่ได้ตอบเป็นข้อมูล — ตรวจว่าใช้ลิงก์ที่ลงท้าย /exec และตั้งสิทธิ์เป็น “Anyone”'); }
  if (j.error) throw new Error(j.error);
  return j;
}
async function apiFetch(url, tab){
  let res;
  try{ res = await fetch(url, {cache:'no-store'}); }catch(e){ throw new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้'); }
  if (!res.ok){
    let msg=''; try{ const j=await res.json(); msg=(j.error&&j.error.message)||''; }catch(e){}
    if (res.status===403) throw new Error('403 ไม่มีสิทธิ์อ่าน — ตรวจว่าแชร์ไฟล์เป็น “ทุกคนที่มีลิงก์ (ผู้ดู)” และ API Key เปิดใช้ Sheets API ไว้');
    if (res.status===404) throw new Error('404 ไม่พบไฟล์ — ตรวจ Spreadsheet ID');
    if (res.status===400 && /parse range|not found/i.test(msg)) throw new Error('ไม่พบแท็บชื่อ “'+tab+'” ในไฟล์');
    if (res.status===400 && /api key/i.test(msg)) throw new Error('API Key ไม่ถูกต้อง');
    if (res.status===429) throw new Error('429 เกินโควตาของ Google — ลองเพิ่มค่า refreshSec');
    throw new Error(res.status+' '+(msg||'โหลดไม่สำเร็จ'));
  }
  return res.json();
}
/* อ่านทั้งแท็บจาก Google Sheets API → array of rows (ข้อความตามที่แสดงในชีต เหมือน CSV) */
async function fetchSheet(id, key, tab){
  const rng = "'" + String(tab).replace(/'/g, "''") + "'";
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(id) + '/values/' + encodeURIComponent(rng)
            + '?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE&key=' + encodeURIComponent(key);
  const j = await apiFetch(url, tab);
  return j.values || [];
}
function hashStr(s){
  let h1=0xdeadbeef^s.length, h2=0x41c6ce57^s.length;
  for (let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)+':'+s.length;
}
const LIVE = {syncing:false, dirty:false, t1:null, t2:null};
function loadProduct(p){
  const slot = S.data[p] = S.data[p] || {rows:[],plan:null};
  if (slot._p) return slot._p;                       // กำลังโหลดอยู่ → ใช้ผลเดียวกัน ไม่ยิงซ้อน
  slot._p = _loadProduct(p, slot).finally(()=>{ slot._p=null; });
  return slot._p;
}
async function _loadProduct(p, slot){
  const src = sourceOf(p); if (!src) return false;
  slot.changed = false;
  try{
    let comb, plan=null, planNote='';
    if (src.type==='script'){
      const j = await fetchScript(src, p); comb = j.combined || []; plan = j.plan || null; planNote = j.planNote || '';
    } else if (src.type==='api'){
      const tabs = CONFIG.sheetNames;
      [comb, plan] = await Promise.all([
        fetchSheet(src.id, src.key, tabs.combined),
        fetchSheet(src.id, src.key, tabs.plan).catch(e=>{ planNote=e.message; return null; })
      ]);
    } else {
      comb = await fetchCSV(src.combinedUrl);
      plan = src.planUrl ? await fetchCSV(src.planUrl) : null;
    }
    const sig = hashStr(JSON.stringify(comb)) + '|' + hashStr(JSON.stringify(plan));
    const changed = slot.sig!==sig || !slot.rows.length;
    if (changed){                                    // แปลงข้อมูลใหม่เฉพาะเมื่อชีตเปลี่ยนจริง
      const rows = buildCombined(comb);
      const pl = (plan && plan.length) ? buildPlan(plan, p) : null;
      slot.rows = rows; slot.plan = pl; slot.sig = sig;
    }
    slot.error = ''; slot.planNote = planNote; slot.at = new Date(); slot.changed = changed;
    slot.source = src.type==='script' ? 'Apps Script (เรียลไทม์)' : src.type==='api' ? 'Google Sheets (เรียลไทม์)' : 'ลิงก์ CSV';
    if (changed) syncFilters(p);
    return true;
  }catch(e){ slot.error = String(e.message||e); return false; }   // ถ้าพลาด คงข้อมูลเดิมไว้ แล้วลองใหม่รอบหน้า
}

async function liveTick(bg){

function xfPass(r, ignore){
  const x=S.xf;
  if (ignore!=='date' && x.dates.size && !x.dates.has(r.date)) return false;
  if (ignore!=='proc' && x.procs.size && !x.procs.has(r.proc)) return false;
  return true;
}
function xfPlanPass(p, ignore){
  const x=S.xf;
  if (ignore!=='date' && x.dates.size && !x.dates.has(p.date)) return false;
  if (ignore!=='proc' && x.procs.size && !p.procs.some(q=>x.procs.has(q))) return false;
  return true;
}
const xfActive = () => S.xf.dates.size>0 || S.xf.procs.size>0 || S.lossCat!=='all';
function xfSel(dim,v){ return dim==='date' ? S.xf.dates.has(v) : dim==='proc' ? S.xf.procs.has(v) : S.lossCat===v; }
function dimHex(c){
  const m=/^#([0-9a-f]{6})$/i.exec(String(c||'').trim()); if (!m) return c;
  const n=parseInt(m[1],16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+',.28)';
}
function toggleXF(dim,v){
  setTimeout(()=>{                                  // รอให้ Chart.js จัดการคลิกเสร็จก่อนค่อยวาดใหม่
    const x=S.xf;
    if (dim==='cat') S.lossCat = S.lossCat===v ? 'all' : v;
    else { const set=dim==='date'?x.dates:x.procs; if (set.has(v)) set.delete(v); else set.add(v); }
    const y=window.scrollY; render(); window.scrollTo(0,y);

}
/* ผูกกราฟกับมิติ: dim = 'date' | 'proc' | 'cat', values[i] = ค่าของแท่งที่ i */
function xfBind(id,dim,values){
  const el=$('#c-'+id); if (!el || typeof Chart==='undefined' || !Chart.getChart) return;
  const ch=Chart.getChart(el); if (!ch) return;
  ch.options.onClick=(e,els)=>{ if (!els||!els.length) return; const v=values[els[0].index]; if (v!=null) toggleXF(dim,v); };
  ch.options.onHover=(e,els)=>{ const t=e.native&&e.native.target; if (t) t.style.cursor=(els&&els.length)?'pointer':'default'; };
  if (values.some(v=>xfSel(dim,v))){                 // จางแท่งที่ไม่ได้เลือก
    ch.data.datasets.forEach(ds=>{
      if (ds.type==='line') return; const base=ds.backgroundColor;

     <div class="form-row">${[['oee','OEE'],['a','Availability'],['p','Performance'],['q','Quality']].map(([k,t])=>`<label class="fld">${t}<input type="number" min="0" max="100" step="0.5" data-t="${k}" value="${T[k]}" style="min-width:90px"></label>`).join('')}</div></section>
   <section class="card"><h3>เชื่อมต่อ Google Sheets แบบเรียลไทม์</h3><div class="sub">ทำครั้งเดียว · ${refreshSec()>0?'ดึงข้อมูลใหม่อัตโนมัติทุก '+refreshSec()+' วินาที ไม่ต้องกดรีเฟรช':'รีเฟรชอัตโนมัติปิดอยู่ (ตั้ง refreshSec ใน CONFIG)'}</div>
     <ol style="margin:0 0 8px;padding-left:18px;font-size:13px;color:var(--ink2)"><li>สร้าง API Key: Google Cloud Console → เปิดใช้ <code>Google Sheets API</code> → Credentials → Create API key</li><li>แต่ละไฟล์ Sheets: แชร์ → การเข้าถึงทั่วไป → <code>ทุกคนที่มีลิงก์</code> สิทธิ์ <code>ผู้ดู</code></li><li>วาง API Key ด้านล่าง และวางลิงก์ไฟล์ของแต่ละผลิตภัณฑ์ แล้วกด “เชื่อมต่อและโหลดทั้งหมด”</li><li>แต่ละไฟล์ต้องมีแท็บ <code>${esc(CONFIG.sheetNames.combined)}</code> และ <code>${esc(CONFIG.sheetNames.plan)}</code></li></ol>
     <div class="form-row"><label class="fld" style="flex:1">Apps Script URL (ลงท้าย /exec) — ไม่ต้องใช้ API Key<input type="url" data-surl="1" value="${esc(scriptUrlOf())}" placeholder="https://script.google.com/macros/s/…/exec" style="width:100%" autocomplete="off"></label></div>
     <div class="form-row"><label class="fld" style="flex:1">รหัสผ่านเข้าถึง (DASH_TOKEN)<input type="password" data-stoken="1" value="${esc(scriptTokenOf())}" style="width:100%" autocomplete="off"></label></div>
     <div class="form-row"><label class="fld" style="flex:1">หรือ Google API Key (ถ้าไม่ใช้ Apps Script)<input type="password" data-key="1" value="${esc(apiKeyOf())}" placeholder="AIza…" style="width:100%" autocomplete="off"></label><button class="btn primary" id="connectAll">เชื่อมต่อและโหลดทั้งหมด</button></div>
     <p class="note">ค่าที่กรอกในหน้านี้จำเฉพาะเบราว์เซอร์เครื่องนี้ · ถ้าอยากให้ทุกเครื่องใช้ได้ทันที ให้ใส่ apiKey และ sheetId ใน CONFIG ที่ต้นไฟล์ · ใครมีลิงก์ไฟล์ชีตจะอ่านข้อมูลได้ (แก้ไขไม่ได้)</p></section></div>
   <div class="grid g2">${blocks}</div>`;
  $$('[data-t]').forEach(i=>i.onchange=()=>{S.targets[i.dataset.t]=+i.value||0; store.set('oee.targets',S.targets);});
  $$('[data-u]').forEach(i=>i.onchange=()=>{const [p,k]=i.dataset.u.split(':'); S.urls[p]=Object.assign({},S.urls[p],{[k]:i.value.trim()}); store.set('oee.urls',S.urls);});
  $$('[data-surl]').forEach(i=>i.onchange=()=>{S.api.scriptUrl=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-stoken]').forEach(i=>i.onchange=()=>{S.api.token=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-key]').forEach(i=>i.onchange=()=>{S.api.key=i.value.trim(); store.set('oee.api',S.api);});
  $$('[data-sid]').forEach(i=>i.onchange=()=>{S.api.ids=S.api.ids||{}; S.api.ids[i.dataset.sid]=i.value.trim(); store.set('oee.api',S.api);});
  const ca=$('#connectAll'); if (ca) ca.onclick=async()=>{ ca.textContent='กำลังโหลด…'; await Promise.all(Object.keys(CONFIG.products).map(p=>loadProduct(p))); render(); };
  $$('[data-load]').forEach(b=>b.onclick=async()=>{const p=b.dataset.load; b.textContent='กำลังโหลด…'; await loadProduct(p); render();});
  $$('[data-file]').forEach(i=>i.onchange=async()=>{ if(i.files[0]){ await loadFile(i.dataset.file,i.files[0]); render(); }});
}
function pageEmpty(){
  $('#view').innerHTML=titleHTML('ยังไม่มีข้อมูล').replace(/<span>.*<\/span>/,'')+`<div class="card empty"><h2>${S.product} ยังไม่มีข้อมูล</h2><p>ใส่ API Key กับลิงก์ไฟล์ Google Sheets ในหน้า “ข้อมูลและเป้าหมาย” เพื่อเชื่อมต่อแบบเรียลไทม์ หรือเลือกไฟล์ .xlsx ที่มีชีต Combined</p>
   <div class="form-row" style="justify-content:center"><button class="btn primary" id="goData">ไปหน้าตั้งค่าข้อมูล</button><label class="btn">เลือกไฟล์ .xlsx / .csv<input type="file" accept=".xlsx,.xlsm,.csv" id="quickFile" hidden></label></div>
   ${D()&&D().error?`<p class="status bad">ผิดพลาด: ${esc(D().error)}</p>`:''}</div>`;
  $('#goData').onclick=()=>{S.page='data';render();};
  $('#quickFile').onchange=async e=>{ if(e.target.files[0]){ await loadFile(S.product,e.target.files[0]); render(); }};
}

/* ---------------------------------------------------------------- render */
const PAGEFN={overview:pageOverview,oee:pageOEE,loss:pageLoss,ng:pageNG,plan:pagePlan,data:pageData};
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  if (typeof Chart!=='undefined'){ Chart.defaults.font.family=FONT; Chart.defaults.color=cv('--ink2'); }
  $('#banner').innerHTML = typeof Chart==='undefined' ? `<div class="warn">โหลดไลบรารีกราฟ (Chart.js) ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต</div>` : '';
  renderRail(); renderFilters(); renderXF();
  if (S.page!=='data' && !hasData()) pageEmpty(); else PAGEFN[S.page]();
  document.title = `${S.product} · แผงติดตามการผลิต OEE`;
  LIVE.dirty=false;
}
(async function boot(){
  applyTheme();
  const loads=Object.keys(CONFIG.products).map(p=>loadProduct(p));
  render();
  await Promise.all(loads);
  if (!hasData()) S.page = hasData()? S.page : 'overview';
  render();
  startLive();
  window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
})();
</script>
</body>
</html>
